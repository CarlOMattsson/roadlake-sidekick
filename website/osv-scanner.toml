# Exceptions for OSV-Scanner for website/package-lock.json (.github/audit/osv-scan.sh and the OpenSSF Scorecard
# Vulnerabilities check, which read this file next to the lockfile). Every entry needs a concrete reason and an
# ignoreUntil date at most 90 days ahead; backend/tests/policy/test_osv_exceptions.py enforces both. An entry is a decision
# for a finding that cannot be fixed by upgrading and does not reach a shipped artifact: when the date passes, upgrade or
# decide again.

# picomatch 2.3.2 and 4.0.7 (GHSA-fc5q-39xc-vjpf, ReDoS); the advisory lists no fixed version. The site is static: astro
# and its toolchain (vite, tinyglobby, fdir, anymatch) run only while building and the published site ships HTML, CSS and
# client scripts, none of which include picomatch. The advisory needs attacker-controlled glob patterns; the build is fed
# only our own paths.
[[IgnoredVulns]]
id = "GHSA-fc5q-39xc-vjpf"
ignoreUntil = 2026-12-17
reason = "Build-time dependency of astro and its toolchain; the site is static and ships no picomatch, and the globs come from our own config. No fixed release exists yet."
