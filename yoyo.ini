# Defaults for the `yoyo` command-line tool, which reads this file from the directory it is run in
# (the repository root), as in `yoyo apply` in QUICKSTART.
[DEFAULT]
sources = migrations
# No database here: pass `--database <migrator URL>` (see QUICKSTART).
migration_table = _yoyo_migration
batch_mode = off
verbosity = 0

