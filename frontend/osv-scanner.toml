# Exceptions for OSV-Scanner for frontend/package-lock.json (.github/audit/osv-scan.sh and the OpenSSF Scorecard
# Vulnerabilities check, which read this file next to the lockfile). Every entry needs a concrete reason and an
# ignoreUntil date at most 90 days ahead; backend/tests/policy/test_osv_exceptions.py enforces both. An entry is a decision
# for a finding that cannot be fixed by upgrading and does not reach a shipped artifact: when the date passes, upgrade or
# decide again.

# picomatch 4.0.7 (GHSA-fc5q-39xc-vjpf, ReDoS), the newest release; the advisory lists no fixed version. It is a dev-only
# dependency (vite, vitest and tinyglobby use it to match our own file globs at build and test time). The advisory needs
# attacker-controlled glob patterns; the build and test tools are fed none, and nothing of it is shipped.
[[IgnoredVulns]]
id = "GHSA-fc5q-39xc-vjpf"
ignoreUntil = 2026-12-17
reason = "Build and test-time dependency only (vite, vitest, tinyglobby); globs come from our own config, not from input. No fixed release exists yet. Not shipped."
