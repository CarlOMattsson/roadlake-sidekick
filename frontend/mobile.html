<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <!--
      Content-Security-Policy of the Android app's page (ADR-005). The page is packaged in the app and loads only its
      own bundle: one module script, one stylesheet, fonts and small images from the bundle (data: for assets Vite
      inlines). It makes no network call of its own: every request to the companion server goes through the native
      SidekickNative plugin (the Capacitor bridge, not fetch/XHR/WebSocket), so connect-src is 'none'. No inline
      script or style and no eval. tests/mobile/mobile-csp.test.ts checks the built page against this list.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="sidekick-app-locale" content="sv" />
    <title>Sidekick</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/mobile/main.tsx"></script>
  </body>
</html>
