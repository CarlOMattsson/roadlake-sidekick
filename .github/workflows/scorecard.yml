name: scorecard

# OpenSSF Scorecard analysis of the public repository; the published result feeds the badge in the README.
# It runs by hand only (Actions, "scorecard", Run workflow, from main), never on push or on a schedule, like
# every other workflow of this repository. The official action refuses any ref other than the default branch
# (ossf/scorecard-action options.Validate), and a `release` event runs on the tag ref, so a release trigger
# cannot work: start it from main after a release is published (docs/maintainers/release.md). The action's
# documentation lists `workflow_dispatch` as experimental; if the Scorecard API rejects a manual run, the step
# only warns and the result stays unpublished.
#
# Publishing results has strict rules for this workflow (see the action's "Workflow Restrictions"): no
# workflow-level write permission, no env or defaults, only the allowed actions in the job, and no `run` steps.
# The repository must be public, because the result is published to api.scorecard.dev.
on:
  workflow_dispatch:

permissions: {}

jobs:
  analysis:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      security-events: write # upload the SARIF result to code scanning
      id-token: write # prove the workflow's identity when publishing results (the badge)
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - name: Keep the result as an artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5
          if-no-files-found: ignore
      - name: Upload the result to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
