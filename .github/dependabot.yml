version: 2

# Weekly update pull requests. Minor and patch updates are grouped into one pull request per
# ecosystem; major updates stay separate so each one is reviewed on its own.
updates:
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
    groups:
      uv-minor-patch:
        update-types: [minor, patch]
    ignore:
      # fastmcp carries the MCP tool/schema contract the apps rely on. It is pinned exactly in
      # backend/pyproject.toml and is only upgraded by hand, after a contract review.
      - dependency-name: fastmcp

  - package-ecosystem: npm
    directories:
      - /frontend
      - /website
      - /website/tools/lighthouse
      - /website/tools/diagrams
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      # ESLint stays on 9.x: eslint-plugin-jsx-a11y (the accessibility lint gate) declares the peer range
      # ^9 and has no release for 10. Lift this when it does.
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: gradle
    directory: /frontend/android
    schedule:
      interval: weekly
    groups:
      gradle-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
    groups:
      docker-minor-patch:
        update-types: [minor, patch]
    ignore:
      # The backend requires Python >=3.13,<3.14 (backend/pyproject.toml, CI, pyright). Patch releases within
      # 3.13 still come through; moving the runtime to a newer Python is a planned change of its own.
      - dependency-name: python
        versions: [">=3.14"]

  - package-ecosystem: docker-compose
    directories:
      - /deploy/selfhost
      - /deploy/work
    schedule:
      interval: weekly
    groups:
      compose-minor-patch:
        update-types: [minor, patch]
