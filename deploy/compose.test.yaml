name: sidekick-test

services:
  db:
    image: postgres:18.4-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
    environment:
      POSTGRES_DB: sidekick_test
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    # Error logs must not carry data: no failing statement text, no DETAIL/CONTEXT lines (they quote row
    # values), no bound parameters. Enforced by backend/tests/policy/test_postgres_log_hardening.py.
    command:
      - "postgres"
      - "-c"
      - "fsync=off"
      - "-c"
      - "synchronous_commit=off"
      - "-c"
      - "full_page_writes=off"
      - "-c"
      - "max_connections=300"
      - "-c"
      - "log_min_error_statement=panic"
      - "-c"
      - "log_error_verbosity=terse"
      - "-c"
      - "log_parameter_max_length_on_error=0"
      - "-c"
      - "log_parameter_max_length=0"
      - "-c"
      - "log_statement=none"
      - "-c"
      - "log_min_duration_statement=-1"
    ports:
      - "${SIDEKICK_TEST_DB_BIND:-127.0.0.1:55433}:5432"
    tmpfs:
      - /var/lib/postgresql
    volumes:
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/001-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sidekick_test"]
      interval: 2s
      timeout: 3s
      retries: 20
