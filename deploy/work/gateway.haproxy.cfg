# Gateway for "Sidekick Work" (deploy/work/compose.yaml). HAProxy expands the GATEWAY_* variables from the
# container environment. Nothing is logged: no request line, no header, no body.

global
    maxconn 512
    # normalize-uri is still marked experimental in HAProxy 3.4; this only allows the keyword, nothing else.
    expose-experimental-directives

defaults
    mode http
    timeout connect 5s
    timeout client 15m
    timeout server 15m
    timeout http-request 30s
    timeout tunnel 1h

resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 10s

# MCP: loopback on the host reaches api through here. api sees the original Host header (127.0.0.1:<port>).
frontend mcp
    bind :8765
    monitor-uri /__gateway_health
    default_backend sidekick_api

backend sidekick_api
    server api api:8000 resolvers docker init-addr libc,none

# Model API: the only way out. One upstream, one path prefix.
frontend model
    bind :"${GATEWAY_MODEL_PORT}"
    # The model API's paths never need percent-encoding, ";" parameters, a backslash or a ".." segment, and each of
    # those is a way to make an upstream read another path than the one judged here (%2e%2e, %%32%65, ..;/, \).
    # So they are refused outright, on the raw path, instead of decoded and chased. What remains is tidied
    # (/./ and // folded) and the base path is matched as a whole segment: exactly "/v1" or beginning "/v1/",
    # never "/v1x".
    acl odd_path path_sub % ; \\
    acl dotdot_path path_sub /../
    acl dotdot_path path_end /..
    http-request deny deny_status 403 if odd_path or dotdot_path
    http-request normalize-uri path-strip-dotdot
    http-request normalize-uri path-merge-slashes
    acl base_path path "${GATEWAY_MODEL_PATH}"
    acl base_path path_beg "${GATEWAY_MODEL_PATH}/"
    http-request deny deny_status 403 if !base_path
    # A virtual-hosted model server routes on Host, so present the real name rather than model.work.internal.
    http-request set-header Host "${GATEWAY_UPSTREAM_HOST_HEADER}"
    default_backend model_server

backend model_server
    server model "${GATEWAY_UPSTREAM}" resolvers docker init-addr libc,none "${GATEWAY_UPSTREAM_TLS[*]}"

# Further allowed addresses (SIDEKICK_WORK_ALLOW) are added here by tools/work.sh: TCP passthrough, one port each.
# @ALLOWLIST@
